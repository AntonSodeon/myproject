plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupAndSubgroups('software.bernie')
        }
    }
    maven {
        // Valkyrien Skies unofficial 1.21.11 port is only published on CurseForge/Modrinth.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup('curse.maven')
        }
    }
    maven {
        name = 'Player Animation Library'
        url = 'https://repo.redlance.org/public/'
        content {
            includeGroupAndSubgroups('com.zigythebird')
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'monolith_arsenal' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    // Automated in-game checks: ./gradlew runClientGameTest (needs a display, e.g. xvfb-run on Linux).
    configureTests {
        createSourceSet = true
        modId = 'monolith_arsenal_gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Bundled libraries: nested into the release jar via Jar-in-Jar, so only one file goes into mods.
    // Each keeps its own fabric.mod.json, mixins and access wideners; Fabric Loader picks the newest
    // copy if the player also installs one of them separately.
    modImplementation include("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    modImplementation include("software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}")
    modImplementation include("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}")

    // Valkyrien Skies: physics backend for vehicles. External mod (NOT bundled): the player installs the
    // original ValkyrienSkies-Fabric-MC1.21.11-v3.1.1.jar (CurseForge file 8724931, SHA-256 30899ecc...) next to us.
    modImplementation "curse.maven:vs-unofficial-port-1556051:${project.valkyrien_skies_curse_file}"
    // The VS API exposes Kotlin types; this is the exact Fabric Language Kotlin build nested inside that VS jar.
    // Development classpath only — at runtime VS brings its own copy.
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    inputs.property 'archivesName', project.base.archivesName

    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Lets the dev server read console commands typed into Gradle's terminal.
tasks.named('runServer') {
    standardInput = System.in
}
