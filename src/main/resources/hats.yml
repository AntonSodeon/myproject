# Каталог шляп QWHatCase.
# Сгенерирован tools/generate_catalog.py из ресурс-пака (assets/minecraft/items/carved_pumpkin.json).
# Ключ секции = постоянный ID шляпы. Его НЕЛЬЗЯ менять после запуска: по нему хранятся коллекции.
# Название (name), описание (lore), редкость и категорию можно менять свободно.
#
# Поля шляпы:
#   name               отображаемое название (&-цвета, &#RRGGBB)
#   lore               описание (список строк)
#   rarity             ID редкости из config.yml -> rarities
#   category           ID категории из блока categories ниже
#   custom-model-data  номер модели в ресурс-паке (range_dispatch custom_model_data)
#   model              путь к модели в паке (справочно; плагин его не использует)
#   material/item-model  базовый предмет и item_model (по умолчанию из defaults)
#   available          false = шляпа не выпадает из кейсов и не продаётся, но остаётся у владельцев
#   compensation       жетоны за дубликат (если не задано — берётся из редкости)
#   legacy-ids         идентификаторы из старого плагина PTrap (для миграции)

defaults:
  # Базовый предмет. PAPER не является блоком и не даёт защиты от эндерменов (в отличие от CARVED_PUMPKIN).
  material: PAPER
  # Определение предмета в паке, в котором лежит range_dispatch по custom_model_data.
  item-model: minecraft:carved_pumpkin
  lore:
    - '&7Кастомная шляпа'

