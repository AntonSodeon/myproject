# QWHatCase — основные настройки.
# После изменения: /hatcases reload (ошибочная конфигурация не применяется — остаётся прежняя).

storage:
  # SQLite-файл в папке плагина. Изменение применяется только после перезапуска.
  file: data.db

# Редкости. Ключ — постоянный ID (используется в hats.yml и cases.yml).
#   order         порядок: больше = реже (для сортировки и объявлений)
#   compensation  жетоны за дубликат по умолчанию (шляпа может задать своё значение)
#   pane          стекло для оформления окна результата
#   win-sound     звук при выигрыше ('' = звук кейса)
rarities:
  common:
    name: 'Обычная'
    color: '&f'
    order: 0
    compensation: 5
    pane: WHITE_STAINED_GLASS_PANE
    win-sound: ''
  uncommon:
    name: 'Необычная'
    color: '&a'
    order: 1
    compensation: 10
    pane: LIME_STAINED_GLASS_PANE
    win-sound: ''
  rare:
    name: 'Редкая'
    color: '&9'
    order: 2
    compensation: 25
    pane: BLUE_STAINED_GLASS_PANE
    win-sound: 'minecraft:custom.mystery_crate.unlock'
  epic:
    name: 'Эпическая'
    color: '&5'
    order: 3
    compensation: 60
    pane: PURPLE_STAINED_GLASS_PANE
    win-sound: 'minecraft:custom.mystery_crate.unlock'
  legendary:
    name: 'Легендарная'
    color: '&6&l'
    order: 4
    compensation: 150
    pane: ORANGE_STAINED_GLASS_PANE
    win-sound: 'minecraft:custom.mystery_crate.unlock.mythical'

# Характеристики шляпы — как в PTrap 1.1.19. Все шляпы получают эти чары и атрибуты,
# а чары, наложенные игроком книгой, добавляются поверх (уровень с книги заменяет базовый).
hat-item:
  enchantments:
    protection: 4
  attributes:
    armor: 3.0
    armor_toughness: 2.0
  # Сияние зачарованного предмета (в PTrap было выключено).
  glint: false
  # Наложение чар на шляпу зачарованной книгой (ПКМ по шляпе в коллекции → «Наложить чары»).
  book-enchanting: true

# Магазин PTrap (/hat menu): каталог шляп с ценой и покупкой через Telegram.
donate-shop:
  enabled: true
  price: '75 ₽'
  telegram: 'AntonSodeon'

hat-display:
  # Шляпка отображается в слоте шлема (так же, как в старом плагине PTrap).
  # Что делать, если на игроке настоящий шлем:
  #   MOVE_TO_INVENTORY — переложить шлем в свободный слот инвентаря; если места нет — отказ с сообщением
  #   REFUSE            — отказать и попросить снять шлем
  # Настоящий шлем никогда не удаляется и не заменяется без сохранения.
  helmet-occupied: MOVE_TO_INVENTORY

resource-pack:
  # PLUGIN — плагин сам предлагает пак при входе (url + sha1 ниже);
  # SERVER — пак выдаёт server.properties или другой плагин, QWHatCase только следит за статусом;
  # NONE   — пак не проверяется.
  mode: PLUGIN
  # Прямая ссылка на zip (например, на свой веб-сервер). Пустая ссылка = режим NONE.
  url: ''
  # SHA-1 zip-файла (40 символов). Обязательно обновляйте при изменении пака.
  sha1: ''
  # true — клиент без пака будет отключён (ванильное поведение «обязательного» пака).
  required: false
  prompt: '&6Для шляпок нужен ресурс-пак сервера.'
  # Блокировать открытие кейсов, пока пак не загружен. Баланс, коллекция и выдача наград работают всегда.
  block-cases-until-loaded: true

animation:
  # Shift+клик по «Открыть» — открыть без анимации (результат тот же).
  allow-skip-with-shift: true

gui:
  # Защита от быстрых повторных кликов.
  click-cooldown-ms: 250

history:
  page-size: 10

# Периодическое объявление (перенесено из старого плагина).
announcement:
  enabled: true
  interval-minutes: 35
  message: '&6🎩 &eКастомные шляпы уже доступны! &7Откройте каталог: &a/hat menu &7| Ваши шляпы: &a/hat &7| Кейсы: &a/cases'

# Кнопка «Купить ключи» в меню кейсов (ссылка из старого плагина).
external-shop:
  enabled: true
  url: 'https://t.me/AntonSodeon'

migration:
  # Файлы players.yml старого плагина (пути от корня сервера). Старые файлы только читаются.
  source-files:
    - plugins/PTrap/players.yml
    - plugins/QWHats/players.yml
  # Предметы шляп PTrap (с меткой ptrap:hat-id) в инвентаре игрока при входе:
  # IMPORT  — как в PTrap: шляпа и её чары добавляются в коллекцию, предмет убирается,
  #           шляпа из слота шлема становится надетой;
  # CONVERT — убирать только предметы шляп, которые уже есть в коллекции;
  # IGNORE  — не трогать старые предметы.
  legacy-items: IMPORT

# ---------------------------------------------------------------------------
# Открытие кейса через привязанный блок: анимация прямо в мире над блоком.
# Открытие командой (/cases open) и из обычного меню (/cases) показывается в GUI, как раньше.
# Любой параметр можно переопределить для конкретного кейса в cases.yml → <кейс>.world-animation.
# Настройки фиксируются в момент старта: /hatcases reload не меняет уже идущую анимацию.
world-animation:
  enabled: true
  spin-duration-ms: 6000        # длительность прокрутки
  result-duration-ms: 3000      # показ выигрыша
  visible-models: 5             # видимых моделей в полосе (нечётное число)
  scroll-items: 30              # сколько моделей проходит через центр до остановки
  height: 0.9                   # высота центра полосы над верхней гранью блока
  spacing: 0.7                  # расстояние между моделями
  model-scale: 0.6              # масштаб моделей в полосе
  center-scale: 0.8             # масштаб модели в центральной позиции
  winner-scale: 1.2             # масштаб выигранной шляпы
  winner-rise: 0.3              # подъём выигранной шляпы
  rotation-speed: 120           # градусов в секунду при показе результата
  deceleration-power: 3.0       # сила замедления: 1 — равномерно, 3 — плавно, 5 — резко в конце
  slowdown-at: 0.75             # доля прокрутки, после которой звучит звук замедления
  view-range: 48                # дальность видимости моделей, блоков
  model-transform: HEAD         # как показывать модель: HEAD (как на голове), FIXED, GUI, GROUND
  model-yaw-offset: 0           # доворот моделей, если в паке «лицо» шляпы смотрит не туда
  glow-center: true             # подсветка модели в центре цветом её редкости
  center-marker: '&e▼'          # метка над центральной позицией ('' — без метки)
  # Звуки: sound — событие ресурс-пака (minecraft:custom....) или обычный звук Minecraft.
  # Слышат только игроки рядом с кейсом (дальность ≈ 16 блоков × volume).
  sounds:
    start:     {enabled: true, sound: 'minecraft:custom.mystery_crate.open',   volume: 1.0, pitch: 1.0}
    # Проигрывается при прохождении КАЖДОЙ модели через центр: при замедлении интервалы растут сами.
    tick:      {enabled: true, sound: 'minecraft:custom.mystery_crate.scroll', volume: 0.6, pitch: 0.9, pitch-end: 1.4}
    # В паке нет отдельного звука замедления — используется стандартный звук Minecraft.
    slowdown:  {enabled: true, sound: 'minecraft:block.note_block.bell',       volume: 0.8, pitch: 0.7}
    # Для редкости с собственным win-sound (config → rarities) используется он.
    win:       {enabled: true, sound: 'minecraft:custom.mystery_crate.unlock', volume: 1.0, pitch: 1.0}
    duplicate: {enabled: true, sound: 'minecraft:custom.currency.tokens',      volume: 1.0, pitch: 1.0}
  # Частицы: type — имя Particle (END_ROD, ENCHANT, DUST, HAPPY_VILLAGER, TOTEM_OF_UNDYING ...).
  # DUST в результате окрашивается в цвет редкости. Видят только игроки рядом.
  particles:
    max-per-tick: 80
    start:  {enabled: true, type: ENCHANT, count: 40, offset-x: 0.6, offset-y: 0.6, offset-z: 0.6, speed: 0.6}
    spin:   {enabled: true, type: END_ROD, count: 2,  offset-x: 0.05, offset-y: 0.05, offset-z: 0.05, speed: 0.01}
    result: {enabled: true, type: DUST,    count: 40, offset-x: 0.5, offset-y: 0.5, offset-z: 0.5, speed: 0.0, size: 1.4}
  # Подпись результата над выигранной шляпой. {hat} {rarity} {case} {player} {tokens} {balance}
  result-label:
    lines: ['&fВы получили: {hat}', '&7Редкость: {rarity}']
    duplicate-lines: ['&fВыпала: {hat}', '&eУже есть в коллекции', '&7Компенсация: &e{tokens} жетонов']
    scale: 0.9
    offset-y: 0.75
    background: '#80000000'     # #AARRGGBB или default
    shadow: true

# Постоянная надпись над каждой точкой кейса (TextDisplay, без сторонних плагинов).
# Переопределяется для кейса в cases.yml → <кейс>.label.
case-labels:
  enabled: true
  height: 0.45                  # над верхней гранью блока
  lines: ['{case}', '&7ПКМ — открыть кейс']   # {case} — название из cases.yml (с его цветами)
  scale: 1.0
  view-range: 32                # блоков
  background: '#40000000'       # #AARRGGBB (прозрачность — первые две цифры) или default
  shadow: true
  see-through: false            # видна сквозь блоки
  billboard: CENTER             # CENTER — поворачивается к смотрящему; VERTICAL; HORIZONTAL; FIXED
  line-width: 200
  raise-during-animation: 0.9   # на сколько поднимать надпись во время открытия
