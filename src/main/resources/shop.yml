# Каталог за жетоны (постоянный, без ротации).
# Цена по редкости применяется ко всем доступным шляпам этой редкости.
# Редкость, которой нет в списке, не продаётся.
rarity-prices:
  common: 50
  uncommon: 120
  rare: 300
  epic: 800

# Точная цена конкретной шляпы (перекрывает цену редкости). 0 — не продаётся.
items:
  # пример: своя цена для конкретной шляпки
  laurel_wreath_shiny: 1500
  # пример: убрать из продажи
  dragon_skull: 0
